services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "9000:9000"   # native protocol
      - "8123:8123"   # http
    environment:
      CLICKHOUSE_DB: apm
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./init:/docker-entrypoint-initdb.d
