services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "9000:9000"   # native protocol
      - "8123:8123"   # http
    environment:
      CLICKHOUSE_DB: apm
      # Dev only: allow the default user network access. The base image disables
      # network access for 'default' when no USER/PASSWORD is set, which breaks
      # host-side clients (clickhouse-go). Production uses explicit credentials
      # (roadmap Phase 4/6 auth/control-plane).
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - ./clickhouse/merge_tree.xml:/etc/clickhouse-server/config.d/merge_tree.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/?query=SELECT+1' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    build: { context: .., dockerfile: cmd/gateway/Dockerfile }
    environment: { APM_CH_DSN: "clickhouse://clickhouse:9000/apm" }
    ports: ["4318:4318"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  query:
    build: { context: .., dockerfile: cmd/query/Dockerfile }
    environment:
      APM_CH_DSN: "clickhouse://clickhouse:9000/apm"
      # Optional Slack-compatible alert webhook. Set your Slack Incoming Webhook
      # URL (or leave unset to disable delivery).
      APM_ALERT_WEBHOOK: "${APM_ALERT_WEBHOOK:-}"
      # Synthetic monitors: "name|url,name|url" (unset = default local+external set).
      APM_SYNTHETICS: "${APM_SYNTHETICS:-}"
    ports: ["8080:8080"]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  web:
    build: { context: ../web, dockerfile: Dockerfile }
    ports: ["3000:80"]
    depends_on: [query]

  # Docker stats collector — reads the engine socket, ships per-container
  # CPU/mem/net to the gateway.
  dockermon:
    build: { context: .., dockerfile: cmd/dockermon/Dockerfile }
    environment:
      APM_GATEWAY: "http://gateway:4318"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [gateway]
    restart: on-failure

  # Multi-service traffic simulator. Off by default; start with:
  #   docker compose -f deploy/docker-compose.yml --profile sim up -d --build sim
  sim:
    build: { context: ../demo/sim, dockerfile: Dockerfile }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://gateway:4318"
      SIM_RPS: "12"
    depends_on: [gateway]
    profiles: ["sim"]
    restart: on-failure
